######################################################################
# GPU/CDI Policy Extensions
#
# Concatenated after rules-base.rego at build time. Provides alternative
# rule definitions (Rego OR semantics) that extend the base policy to
# support NVIDIA GPU workloads with CDI (Container Device Interface)
# injected resources.
#
# Extension points implemented:
#   allow_hooks             — accept nvidia-cdi-hook CreateContainer hooks
#   allow_resource_devices  — accept CDI-injected cgroup device rules
#   allow_single_linux_device — accept GPU device nodes (/dev/nvidia*, /dev/dri/*)
#   allow_all_mounts        — separate CDI bind-mounts from standard mounts
#   allow_anno_key_value    — accept cdi.k8s.io/* annotations
######################################################################

######################################################################
# Hook validation
#
# CDI-injected containers carry CreateContainer hooks pointing at
# /usr/bin/nvidia-cdi-hook. All hooks must use this path.

allow_hooks(hooks) if {
    not is_null(hooks)
    every hook in hooks.CreateContainer {
        hook.Path == "/usr/bin/nvidia-cdi-hook"
    }
}

######################################################################
# Device cgroup rules
#
# CDI injects cgroup "allow" rules for GPU device nodes (major 195
# for nvidia, major 226 for drm).

allow_resource_devices(devices) if {
    count(devices) > 0
    every device in devices {
        device.Allow == true
    }
}

######################################################################
# NVIDIA bind-mount recognition
#
# CDI injects ~50 read-only bind mounts for NVIDIA libraries, firmware,
# binaries, and Vulkan/EGL configs. These are identified by mount
# options and a destination path pattern.

is_nvidia_cdi_mount(mount) if {
    mount.type_ == "bind"
    some opt1 in mount.options; opt1 == "ro"
    some opt2 in mount.options; opt2 == "nosuid"
    some opt3 in mount.options; opt3 == "nodev"
    some opt4 in mount.options; opt4 == "rbind"
    nvidia_mount_path_pattern(mount.destination)
}

nvidia_mount_path_pattern(dest) if {
    regex.match("^/usr/lib/x86_64-linux-gnu/lib(nvidia|cuda|nvcuv|nv|EGL|GL|OpenGL|wayland-egl|vdpau)", dest)
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/usr/bin/nvidia-", dest)
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/etc/(vulkan|nvidia|egl)/", dest)
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/usr/share/(vulkan|nvidia|egl|glvnd)/", dest)
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/lib/firmware/nvidia/", dest)
}
nvidia_mount_path_pattern(dest) if {
    dest == "/run/nvidia-persistenced/socket"
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/usr/lib/xorg/", dest)
}
nvidia_mount_path_pattern(dest) if {
    regex.match("^/dev/dri/by-path/", dest)
}

######################################################################
# GPU device node allowlist

allow_gpu_device_path(path) if {
    regex.match("^/dev/nvidia[0-9]+$", path)
}
allow_gpu_device_path(path) if {
    path == "/dev/nvidiactl"
}
allow_gpu_device_path(path) if {
    path == "/dev/nvidia-modeset"
}
allow_gpu_device_path(path) if {
    regex.match("^/dev/nvidia-uvm(-tools)?$", path)
}
allow_gpu_device_path(path) if {
    regex.match("^/dev/dri/(card|renderD)[0-9]+$", path)
}

######################################################################
# Linux device node: accept GPU devices not in policy

allow_single_linux_device(p_devices, i_device) if {
    allow_gpu_device_path(i_device.Path)
}

######################################################################
# Mount validation: separate CDI-injected mounts from standard mounts
#
# Standard mounts must match policy entries 1:1. CDI-injected NVIDIA
# bind-mounts are validated by destination path pattern instead.

allow_all_mounts(p_oci, i_oci, i_storages, bundle_id, sandbox_id) if {
    i_standard_mounts := [m | m := i_oci.Mounts[_]; not is_nvidia_cdi_mount(m)]
    i_cdi_mounts := [m | m := i_oci.Mounts[_]; is_nvidia_cdi_mount(m)]

    count(i_cdi_mounts) > 0

    p_matches := { p_index | some i_index; p_index = allow_mount(p_oci, i_standard_mounts[i_index], i_storages, bundle_id, sandbox_id) }
    count(p_matches) == count(i_standard_mounts)

    every cdi_mount in i_cdi_mounts {
        nvidia_mount_path_pattern(cdi_mount.destination)
    }
}

######################################################################
# Annotation: accept CDI-injected annotations (cdi.k8s.io/*)

allow_anno_key_value(i_key, i_value, p_container) if {

    startswith(i_key, "cdi.k8s.io/")

}


######################################################################
# Image Pinning Policy Extension
#
# Concatenated after rules-base.rego at build time. Activates image
# reference pinning so that the OPA policy enforces which container
# images are allowed, binding them to the attestation chain via RTMR3.
#
# When active:
#   - io.kubernetes.cri.image-name annotation must match the value
#     embedded by genpolicy in the policy container data.
#   - image_guest_pull storage source must match an image reference
#     from a policy container.
#
# For effective pinning, use digest references in manifests:
#   image: registry.io/image@sha256:abc123...
# Tags (:latest, :v1.0) are mutable and provide weaker guarantees.
#
# Extension points implemented:
#   image_pinning_active        — feature flag (overrides base default)
#   allow_image_name_annotation — pin image-name annotation to policy data
#   allow_guest_pull_source     — pin storage source to policy containers
######################################################################

# Activate image pinning — disables the permissive defaults in the base.
image_pinning_active := true

######################################################################
# Annotation pinning
#
# The input image-name annotation must exactly match the value from the
# policy container that genpolicy generated from the manifest.

allow_image_name_annotation(i_value, p_container) if {
    p_value := p_container.OCI.Annotations["io.kubernetes.cri.image-name"]
    p_value == i_value
}

######################################################################
# Storage source pinning
#
# The image_guest_pull storage source (the image reference passed to
# CDH/image-rs for pulling) must match an image reference from one of
# the policy containers. This prevents the host from requesting a pull
# of an image not specified in the attested policy.

allow_guest_pull_source(source) if {
    source == "pause"
}

allow_guest_pull_source(source) if {
    source != "pause"
    some p_container in policy_data.containers
    p_image := p_container.OCI.Annotations["io.kubernetes.cri.image-name"]
    source == p_image
