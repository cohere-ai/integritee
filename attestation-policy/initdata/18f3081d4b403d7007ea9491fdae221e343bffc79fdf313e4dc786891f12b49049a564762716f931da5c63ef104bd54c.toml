allow_linux_sysctl(p_linux, i_linux) if {
    p_sysctl := p_linux.Sysctl
    i_sysctl := i_linux.Sysctl
    count(p_sysctl) == 0
}

allow_linux_sysctl(p_linux, i_linux) if {
    p_sysctl := p_linux.Sysctl
    i_sysctl := i_linux.Sysctl
    every i_name, i_val in i_sysctl {
