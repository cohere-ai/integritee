name: Attest Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.1)"
        required: true
        type: string
      reason:
        description: "Reason for this release"
        required: false
        type: string
      models:
        description: "Comma-separated model names to attest (leave empty for all)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  KATA_VERSION: "3.12.0"
  CVM_MEASURE_REPO: "https://github.com/cohere-ai/cvm-measure.git"

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Setup: tools and dependencies
      # ----------------------------------------------------------------
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cvm-measure
        run: pip install git+${{ env.CVM_MEASURE_REPO }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Fetch genpolicy binary
        run: |
          KATA_TAG="$KATA_VERSION"

          # Newer Kata releases (>=3.13) ship a separate tools tarball (.tar.zst).
          # Older releases (e.g. 3.12.0) only have the full static bundle (.tar.xz).
          TOOLS_URL="https://github.com/kata-containers/kata-containers/releases/download/${KATA_TAG}/kata-tools-static-${KATA_TAG}-amd64.tar.zst"
          STATIC_URL="https://github.com/kata-containers/kata-containers/releases/download/${KATA_TAG}/kata-static-${KATA_TAG}-amd64.tar.xz"

          echo "Trying tools tarball first..."
          if curl -fSL "$TOOLS_URL" -o genpolicy.tar.zst 2>/dev/null; then
            tar --zstd -xf genpolicy.tar.zst opt/kata/bin/genpolicy
          else
            echo "Tools tarball not found, falling back to full static bundle..."
            curl -fSL "$STATIC_URL" -o genpolicy.tar.xz
            tar -xf genpolicy.tar.xz opt/kata/bin/genpolicy
          fi

          # Verify integrity using the GitHub release asset digest when available
          # gh api repos/kata-containers/kata-containers/releases/tags/${KATA_TAG} \
          #   --jq '.assets[] | select(.name | test("kata-tools-static|kata-static")) | {name, digest: .digest}'

          mv opt/kata/bin/genpolicy /usr/local/bin/genpolicy
          chmod +x /usr/local/bin/genpolicy
          genpolicy --version || echo "genpolicy installed (version flag may not be supported)"
          echo "GENPOLICY_VERSION=${KATA_TAG}" >> "$GITHUB_ENV"

      - name: Get cvm-measure version
        run: |
          CVM_MEASURE_VERSION=$(cvm-measure --version 2>&1 | head -1 || echo "unknown")
          echo "CVM_MEASURE_VERSION=$CVM_MEASURE_VERSION" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------
      # Resolve model list
      # ----------------------------------------------------------------
      - name: Resolve models
        id: models
        run: |
          if [[ -n "${{ inputs.models }}" ]]; then
            MODELS="${{ inputs.models }}"
          else
            MODELS=$(ls -1 models/ | tr '\n' ',' | sed 's/,$//')
          fi
          echo "list=$MODELS" >> "$GITHUB_OUTPUT"
          echo "Attesting models: $MODELS"

      # ----------------------------------------------------------------
      # Fetch CVM artifacts (shared across all models)
      # ----------------------------------------------------------------
      - name: Fetch CVM artifacts
        run: |
          mkdir -p cvm-artifacts

          # OVMF firmware -- pinned version from GCP TCB integrity bucket
          # TODO: replace with actual firmware URL/version for your environment
          echo "TODO: Download OVMF firmware" > cvm-artifacts/OVMF.fd.placeholder
          # curl -fSL "$OVMF_URL" -o cvm-artifacts/OVMF.fd

          # UKI (BOOTX64.EFI) -- from podvm image build pipeline
          # TODO: replace with actual UKI source
          echo "TODO: Download UKI" > cvm-artifacts/BOOTX64.EFI.placeholder
          # curl -fSL "$UKI_URL" -o cvm-artifacts/BOOTX64.EFI

          # Baseline JSON -- from cohere-cc-baselines repo
          # TODO: replace with actual baseline fetch
          echo "TODO: Download baseline" > cvm-artifacts/baseline.json.placeholder
          # curl -fSL "https://raw.githubusercontent.com/cohere-ai/cohere-cc-baselines/main/baselines/gcp/tdx/a3-highgpu-1g.json" \
          #   -o cvm-artifacts/baseline.json

          echo "FIRMWARE_REF=TODO" >> "$GITHUB_ENV"
          echo "UKI_REF=TODO" >> "$GITHUB_ENV"
          echo "BASELINE_REF=TODO" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------
      # Per-model loop: genpolicy -> initdata -> podspec -> cvm-measure
      # ----------------------------------------------------------------
      - name: Generate policies and measurements
        run: |
          IFS=',' read -ra MODEL_ARRAY <<< "${{ steps.models.outputs.list }}"

          for MODEL in "${MODEL_ARRAY[@]}"; do
            MODEL=$(echo "$MODEL" | xargs)  # trim whitespace
            echo "=========================================="
            echo "Processing model: $MODEL"
            echo "=========================================="

            mkdir -p "artifacts/${MODEL}"

            # Merge base rules/settings with per-model overrides
            python3 scripts/merge-policy-inputs.py \
              --base-rules rules/rules.rego \
              --base-settings rules/genpolicy-settings.json \
              --model-dir "models/${MODEL}" \
              --output-dir "artifacts/${MODEL}"

            # --- Step 1: Run genpolicy ---
            cp "models/${MODEL}/podspec.yaml" "artifacts/${MODEL}/podspec_original.yaml"

            genpolicy \
              -y "artifacts/${MODEL}/podspec_original.yaml" \
              -p "artifacts/${MODEL}/merged-rules.rego" \
              -j "artifacts/${MODEL}/merged-settings.json" \
              -r > "artifacts/${MODEL}/policy.rego" \
              || echo "WARNING: genpolicy -r failed for $MODEL"

            genpolicy \
              -y "artifacts/${MODEL}/podspec_original.yaml" \
              -p "artifacts/${MODEL}/merged-rules.rego" \
              -j "artifacts/${MODEL}/merged-settings.json" \
              -b > "artifacts/${MODEL}/initdata_b64.txt" \
              || echo "WARNING: genpolicy -b failed for $MODEL"

            # --- Step 2: Create podspec_with_initdata ---
            INITDATA_B64=$(cat "artifacts/${MODEL}/initdata_b64.txt" 2>/dev/null || echo "")
            if [[ -n "$INITDATA_B64" ]]; then
              python3 -c "
          import yaml, sys
          with open('models/${MODEL}/podspec.yaml') as f:
              doc = yaml.safe_load(f)
          annos = doc['spec']['template']['metadata'].setdefault('annotations', {})
          annos['io.katacontainers.config.hypervisor.cc_init_data'] = '${INITDATA_B64}'
          yaml.dump(doc, sys.stdout, default_flow_style=False)
          " > "artifacts/${MODEL}/podspec_with_initdata.yaml" 2>/dev/null \
                || cp "models/${MODEL}/podspec.yaml" "artifacts/${MODEL}/podspec_with_initdata.yaml"
            else
              cp "models/${MODEL}/podspec.yaml" "artifacts/${MODEL}/podspec_with_initdata.yaml"
            fi

            # --- Step 3: Compute measurements with cvm-measure ---
            # TODO: Replace placeholders with real artifact paths once CVM artifacts are fetched
            # cvm-measure tdx \
            #   --firmware cvm-artifacts/OVMF.fd \
            #   --uki cvm-artifacts/BOOTX64.EFI \
            #   --baseline cvm-artifacts/baseline.json \
            #   --ram 240 \
            #   --initdata "artifacts/${MODEL}/initdata.toml" \
            #   --output-format json > "artifacts/${MODEL}/measurements.json"

            # Placeholder measurements for workflow testing
            echo '{"mrtd":"TODO","rtmr0":"TODO","rtmr1":"TODO","rtmr2":"TODO","rtmr3":"TODO"}' \
              > "artifacts/${MODEL}/measurements.json"

            echo "Completed: $MODEL"
          done

      # ----------------------------------------------------------------
      # Generate ITA policy (single policy, all models)
      # ----------------------------------------------------------------
      - name: Generate ITA attestation policy
        run: |
          python3 scripts/generate-ita-policy.py \
            --measurements-dir artifacts/ \
            --template attestation-policy/template.rego \
            --output artifacts/ita-attestation-policy.rego

      # ----------------------------------------------------------------
      # Upload to ITA
      # ----------------------------------------------------------------
      - name: Upload policy to ITA
        id: ita
        env:
          ITA_API_URL: ${{ secrets.ITA_API_URL }}
          ITA_ADMIN_API_KEY: ${{ secrets.ITA_ADMIN_API_KEY }}
        run: |
          POLICY_NAME="model-integrity-${{ inputs.version }}"

          if [[ -n "$ITA_API_URL" && -n "$ITA_ADMIN_API_KEY" ]]; then
            POLICY_ID=$(./scripts/upload-ita-policy.sh \
              --policy-file artifacts/ita-attestation-policy.rego \
              --policy-name "$POLICY_NAME" \
              --api-url "$ITA_API_URL" \
              --api-key "$ITA_ADMIN_API_KEY")
          else
            echo "WARNING: ITA credentials not configured, using placeholder policy_id"
            POLICY_ID="00000000-0000-0000-0000-000000000000"
          fi

          echo "policy_id=$POLICY_ID" >> "$GITHUB_OUTPUT"
          echo "ITA Policy ID: $POLICY_ID"

      # ----------------------------------------------------------------
      # Build predicates and sign with Sigstore (per model)
      # ----------------------------------------------------------------
      - name: Fetch previous release log index
        id: chain
        run: |
          PREV_INDEX=0
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          if [[ -n "$LATEST" ]]; then
            echo "Previous release: $LATEST"
            # TODO: extract Rekor log index from previous release's attestation bundle
            # For now, use 0 (genesis)
          fi
          echo "previous_log_index=$PREV_INDEX" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build predicates
        run: |
          python3 scripts/build-predicate.py \
            --artifacts-dir artifacts/ \
            --policy-id "${{ steps.ita.outputs.policy_id }}" \
            --version "${{ inputs.version }}" \
            --genpolicy-version "${{ env.GENPOLICY_VERSION }}" \
            --cvm-measure-version "${{ env.CVM_MEASURE_VERSION }}" \
            --firmware-ref "${{ env.FIRMWARE_REF }}" \
            --uki-ref "${{ env.UKI_REF }}" \
            --baseline-ref "${{ env.BASELINE_REF }}" \
            --previous-log-index "${{ steps.chain.outputs.previous_log_index }}"

      - name: Sign attestations with Sigstore (per model)
        run: |
          IFS=',' read -ra MODEL_ARRAY <<< "${{ steps.models.outputs.list }}"

          for MODEL in "${MODEL_ARRAY[@]}"; do
            MODEL=$(echo "$MODEL" | xargs)
            MEAS_FILE="artifacts/${MODEL}/measurements.json"
            PREDICATE_FILE="artifacts/${MODEL}/predicate.json"

            if [[ ! -f "$MEAS_FILE" || ! -f "$PREDICATE_FILE" ]]; then
              echo "Skipping $MODEL (missing artifacts)"
              continue
            fi

            echo "=========================================="
            echo "Signing attestation for: $MODEL"
            echo "=========================================="

            cosign attest-blob \
              --predicate "$PREDICATE_FILE" \
              --type "https://cohere.com/attestation-policy-ledger/v1" \
              --bundle "artifacts/${MODEL}/attestation.sigstore.json" \
              -y \
              "$MEAS_FILE"

            echo "Bundle written: artifacts/${MODEL}/attestation.sigstore.json"
          done

      # ----------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------
      - name: Prepare release assets
        id: assets
        run: |
          mkdir -p release-assets

          IFS=',' read -ra MODEL_ARRAY <<< "${{ steps.models.outputs.list }}"
          RELEASE_BODY="# Model Attestation Release ${{ inputs.version }}\n\n"

          if [[ -n "${{ inputs.reason }}" ]]; then
            RELEASE_BODY+="**Reason:** ${{ inputs.reason }}\n\n"
          fi

          RELEASE_BODY+="**ITA Policy ID:** \`${{ steps.ita.outputs.policy_id }}\`\n\n"
          RELEASE_BODY+="## Per-Model Artifacts\n\n"

          for MODEL in "${MODEL_ARRAY[@]}"; do
            MODEL=$(echo "$MODEL" | xargs)

            mkdir -p "release-assets/${MODEL}"
            for f in measurements.json policy.rego podspec_with_initdata.yaml predicate.json attestation.sigstore.json; do
              if [[ -f "artifacts/${MODEL}/${f}" ]]; then
                cp "artifacts/${MODEL}/${f}" "release-assets/${MODEL}/${f}"
              fi
            done

            MEAS=$(cat "artifacts/${MODEL}/measurements.json" 2>/dev/null || echo "{}")
            RELEASE_BODY+="### ${MODEL}\n\n"
            RELEASE_BODY+="\`\`\`json\n${MEAS}\n\`\`\`\n\n"
          done

          cp artifacts/ita-attestation-policy.rego release-assets/

          echo -e "$RELEASE_BODY" > release-body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.version }}"

          # Collect all asset files
          ASSET_FLAGS=""
          for f in $(find release-assets -type f); do
            ASSET_FLAGS="$ASSET_FLAGS $f"
          done

          gh release create "$TAG" \
            --title "Model Attestation $TAG" \
            --notes-file release-body.md \
            $ASSET_FLAGS
