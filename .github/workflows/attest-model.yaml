name: Attest Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.1)"
        required: true
        type: string
      reason:
        description: "Reason for this release"
        required: false
        type: string
      ita_slot:
        description: "ITA policy slot override (auto = blue/green rotation)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - slot-a
          - slot-b

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: read

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines,blobheart

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------------------------------------------------
      # Initialize predicate with workflow-level context
      # ----------------------------------------------------------------
      - name: Fetch previous release log index
        id: chain
        run: |
          PREV_INDEX=0
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          if [[ -n "$LATEST" ]]; then
            echo "Previous release: $LATEST"
          fi
          echo "previous_log_index=$PREV_INDEX" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Initialize predicate
        run: |
          python3 -c "
          import json, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          with open('predicate.json', 'w') as f:
              json.dump({
                  'version': '${{ inputs.version }}',
                  'manifest_commit': commit,
                  'previous_rekor_log_index': ${{ steps.chain.outputs.previous_log_index }},
              }, f, indent=2)
              f.write('\n')
          "

      # ----------------------------------------------------------------
      # Generate policy (appends targets + cvm_measure_version to predicate)
      # ----------------------------------------------------------------
      - name: Generate policy
        uses: ./.github/actions/generate-policy
        with:
          manifest-file: attestation-policy/policy-manifest.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          output-artifacts-dir: artifacts
          output-policy-file: attestation-policy.rego
          predicate-file: predicate.json

      # ----------------------------------------------------------------
      # Upload to ITA (blue/green slot selection)
      # ----------------------------------------------------------------
      - name: Select ITA slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ inputs.ita_slot }}" != "auto" ]]; then
            eval "$(ITA_SLOT_OVERRIDE=${{ inputs.ita_slot }} ./.github/workflows/attest-model/select-ita-slot.sh)"
          else
            eval "$(./scripts/select-ita-slot.sh)"
          fi
          echo "policy_slot=$ITA_POLICY_SLOT" >> "$GITHUB_OUTPUT"
          echo "policy_id=$ITA_POLICY_ID" >> "$GITHUB_OUTPUT"
          echo "policy_name=$ITA_POLICY_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload policy to ITA
        id: ita
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: attestation-policy.rego
          policy-id: ${{ steps.slot.outputs.policy_id }}
          policy-name: ${{ steps.slot.outputs.policy_name }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}
          predicate-file: predicate.json

      # ----------------------------------------------------------------
      # Sign policy with Sigstore
      # ----------------------------------------------------------------
      - name: Sign policy with Sigstore
        run: |
          cosign attest-blob \
            --predicate predicate.json \
            --type "https://cohere.com/attestation-policy/v1" \
            --bundle attestation.sigstore.json \
            -y \
            attestation-policy.rego

      # ----------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp attestation-policy.rego release-assets/attestation-policy.rego
          cp predicate.json release-assets/predicate.json
          cp attestation.sigstore.json release-assets/attestation.sigstore.json

          RELEASE_BODY="# Attestation Policy Release ${{ inputs.version }}\n\n"

          if [[ -n "${{ inputs.reason }}" ]]; then
            RELEASE_BODY+="**Reason:** ${{ inputs.reason }}\n\n"
          fi

          RELEASE_BODY+="**ITA Policy ID:** \`${{ steps.ita.outputs.policy-id }}\`\n"
          RELEASE_BODY+="**ITA Policy Slot:** \`${{ steps.slot.outputs.policy_slot }}\`\n\n"
          RELEASE_BODY+="## Predicate\n\n"
          RELEASE_BODY+="\`\`\`json\n$(cat predicate.json)\n\`\`\`\n"

          echo -e "$RELEASE_BODY" > release-body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.version }}" \
            --title "Attestation Policy ${{ inputs.version }}" \
            --notes-file release-body.md \
            release-assets/*
