# Imports confidential-compute targets from Blobheart, merges them into the
# policy manifest, and publishes the change so the release workflow can run.
#
# generate: builds the merged manifest and diff. Authenticates to read
# blobheart and the current manifest, but does not write to integritee.
# publish: pushes the merged manifest to main. Gated by the `release`
# environment, so it runs from main or an allowed branch.
name: Add from Blobheart
run-name: Blobheart policy ${{ github.event.client_payload.correlation_id || github.run_id }}

on:
  repository_dispatch:
    types: [blobheart-deploy]
  workflow_dispatch:
    inputs:
      blobheart_refs:
        description: "Space-separated blobheart commit SHAs to derive manifests from"
        required: true
        type: string
      publish:
        description: "Commit the merged manifest to main (main only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: add-from-blobheart
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    env:
      BLOBHEART_REFS: ${{ inputs.blobheart_refs || github.event.client_payload.blobheart_refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      # Read-only token for blobheart + baselines. Cannot write to integritee.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines,blobheart

      - name: Validate Blobheart refs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 .github/workflows/add-from-blobheart/manage.py validate
          --blobheart-refs "$BLOBHEART_REFS"
          --dry-run "true"

      - name: Derive manifests from blobheart sources
        id: derive
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-refs: ${{ env.BLOBHEART_REFS }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Merge into policy manifest
        id: merge
        uses: ./.github/actions/merge-manifest
        with:
          base: attestation-policy/policy-manifest.yaml
          new: ${{ steps.derive.outputs.manifest-files }}

      - name: Update policy manifest
        id: changes
        env:
          MERGED_MANIFEST: ${{ steps.merge.outputs.manifest-file }}
          ADDED_TARGETS: ${{ steps.merge.outputs.added }}
        run: >-
          python3 .github/workflows/add-from-blobheart/manage.py update
          --merged "$MERGED_MANIFEST"
          --manifest attestation-policy/policy-manifest.yaml
          --initdata-source "${{ steps.derive.outputs.initdata-dir }}"
          --initdata-dir attestation-policy/initdata
          --added "$ADDED_TARGETS"

      - name: Validate policy manifest update
        if: steps.changes.outputs.changed == 'true'
        uses: ./.github/actions/validate-manifest
        with:
          manifest-file: attestation-policy/policy-manifest.yaml

      - name: Upload merged manifest
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: merged-policy-manifest
          path: |
            attestation-policy/policy-manifest.yaml
            attestation-policy/initdata/

  publish:
    needs: generate
    # A repository_dispatch runs publish unconditionally. A manual dispatch
    # requires the publish flag to be selected, otherwise it stops after
    # generate. The environment gates the CC_POLICY_APP token to main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'repository_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      BLOBHEART_REFS: ${{ inputs.blobheart_refs || github.event.client_payload.blobheart_refs }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Download merged manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: merged-policy-manifest

      # Write token. Only available here because this job has
      # environment: release; generate above cannot read these secrets.
      - name: Mint Integritee write token
        id: write-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CC_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: integritee
          permission-contents: write

      - name: Commit and push manifest
        id: publish
        env:
          GH_TOKEN: ${{ steps.write-token.outputs.token }}
        run: >-
          python3 .github/workflows/add-from-blobheart/manage.py publish
          --manifest attestation-policy/policy-manifest.yaml
          --initdata-dir attestation-policy/initdata
          --blobheart-refs "$BLOBHEART_REFS"
          --repository "$GITHUB_REPOSITORY"

      - name: Wait for production policy release
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.publish.outputs.release-sha }}
        run: >-
          python3 .github/workflows/add-from-blobheart/manage.py wait-release
          --repository "$GITHUB_REPOSITORY"
          --manifest attestation-policy/policy-manifest.yaml
          --release-sha "$RELEASE_SHA"
