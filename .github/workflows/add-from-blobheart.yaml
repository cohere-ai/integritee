name: Add from Blobheart

on:
  workflow_dispatch:
    inputs:
      blobheart_refs:
        description: "Comma-separated blobheart commit SHAs to derive manifests from"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  add-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: blobheart

      - name: Derive manifests from blobheart refs
        id: derive
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          IFS=',' read -ra REFS <<< "${{ inputs.blobheart_refs }}"
          MANIFEST_FILES=""

          for REF in "${REFS[@]}"; do
            REF=$(echo "$REF" | xargs)
            echo "========================================"
            echo "Deriving manifest from blobheart ref: $REF"
            echo "========================================"

            OUTPUT="/tmp/manifest-${REF}.yaml"
            python3 .github/actions/derive-manifest/derive.py \
              --blobheart-ref "$REF" \
              --output "$OUTPUT"

            MANIFEST_FILES="$MANIFEST_FILES $OUTPUT"
          done

          echo "manifest-files=$MANIFEST_FILES" >> "$GITHUB_OUTPUT"

      - name: Merge into policy manifest
        id: merge
        run: |
          python3 scripts/merge-manifest.py \
            --base attestation-policy/policy-manifest.yaml \
            --new ${{ steps.derive.outputs.manifest-files }} \
            --output attestation-policy/policy-manifest.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet attestation-policy/policy-manifest.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new targets to add"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New targets detected"
            git diff attestation-policy/policy-manifest.yaml
          fi

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="add-blobheart-targets-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add attestation-policy/policy-manifest.yaml
          git commit -m "$(cat <<'EOF'
          Add targets from blobheart refs

          Blobheart refs: ${{ inputs.blobheart_refs }}
          EOF
          )"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "Add attestation targets from blobheart" \
            --body "$(cat <<'EOF'
          ## Summary

          Adds new measurement targets to `attestation-policy/policy-manifest.yaml` derived from blobheart ref(s): `${{ inputs.blobheart_refs }}`.

          Targets were resolved via the `derive-manifest` action and merged with content-addressed dedup.
          EOF
          )"
