name: Add from Blobheart

on:
  workflow_dispatch:
    inputs:
      blobheart_refs:
        description: "Space-separated blobheart commit SHAs to derive manifests from"
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-targets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: blobheart

      - name: Derive manifests from blobheart refs
        id: derive
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-refs: ${{ inputs.blobheart_refs }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Merge into policy manifest
        id: merge
        run: |
          python3 .github/workflows/add-from-blobheart/merge-manifest.py \
            --base attestation-policy/policy-manifest.yaml \
            --new ${{ steps.derive.outputs.manifest-files }} \
            --output attestation-policy/policy-manifest.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet attestation-policy/policy-manifest.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new targets to add"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New targets detected"
            git diff attestation-policy/policy-manifest.yaml
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add attestation-policy/policy-manifest.yaml
          git commit -m "feat(policy): add attestation targets from blobheart refs ${{ inputs.blobheart_refs }}"
          git push
