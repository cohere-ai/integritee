name: Add from Blobheart

on:
  push:
    branches: [shariq/policy-automation] # temporary: remove before merging
  repository_dispatch:
    types: [blobheart-deploy]
  workflow_dispatch:
    inputs:
      blobheart_refs:
        description: "Space-separated blobheart commit SHAs to derive manifests from"
        required: true
        type: string
      dry_run:
        description: "If true, show what would change without committing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  add-targets:
    runs-on: ubuntu-latest
    env:
      BLOBHEART_REFS: ${{ inputs.blobheart_refs || github.event.client_payload.blobheart_refs || '47ded742780246155c119caa1b3f90fd8b598c58' }}
      DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: blobheart

      - name: Derive manifests from blobheart refs
        id: derive
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-refs: ${{ env.BLOBHEART_REFS }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Merge into policy manifest
        id: merge
        uses: ./.github/actions/merge-manifest
        with:
          base: attestation-policy/policy-manifest.yaml
          new: ${{ steps.derive.outputs.manifest-files }}

      - name: Update policy manifest
        id: changes
        run: |
          if [[ "${{ steps.merge.outputs.added }}" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new targets to add"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New targets detected: ${{ steps.merge.outputs.added }} added"
            cp "${{ steps.merge.outputs.manifest-file }}" attestation-policy/policy-manifest.yaml
            git diff attestation-policy/policy-manifest.yaml
          fi

      - name: Upload merged manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: merged-policy-manifest
          path: attestation-policy/policy-manifest.yaml

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true' && env.DRY_RUN == 'false'
        run: |
          git add attestation-policy/policy-manifest.yaml
          git commit -m "feat(policy): add attestation targets from blobheart refs ${{ env.BLOBHEART_REFS }}"
          git push
