name: Release Integritee Actions

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"

permissions:
  contents: read

concurrency:
  group: release-integritee-actions
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CC_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: integritee
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve action release version
        id: version
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/workflows/release-actions/manage.py

      - name: Create action release tag
        if: steps.version.outputs.create == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "integritee-policy-automation[bot]"
          git config user.email "integritee-policy-automation[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag --annotate "$VERSION" --message "Integritee Actions $VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Report existing action release
        if: steps.version.outputs.create != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "Commit already released as ${VERSION}"
