name: Test Actions

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/test-actions.yaml"
      - ".github/workflows/test-actions/**"

permissions:
  contents: read
  packages: read

jobs:
  test-generate-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Initialize predicate
        run: echo '{}' > predicate.json

      - name: Generate policy
        uses: ./.github/actions/generate-policy
        with:
          manifest-file: .github/workflows/test-actions/generate-policy/policy-manifest.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          output-artifacts-dir: artifacts
          output-policy-file: generated-policy.rego
          predicate-file: predicate.json

      - name: Verify generated rego matches expected
        run: |
          grep -v 'integritee_nonce' generated-policy.rego > policy-no-nonce.rego
          diff .github/workflows/test-actions/generate-policy/expected-policy.rego policy-no-nonce.rego

      - name: Verify predicate is consistent with rego
        run: |
          python3 -c "
          import json, sys
          pred = json.loads(open('predicate.json').read())
          rego = open('generated-policy.rego').read()
          assert 'targets' in pred, 'predicate missing targets'
          assert 'cvm_measure_version' in pred, 'predicate missing cvm_measure_version'
          for t in pred['targets']:
              for field, val in t['measurements'].items():
                  assert val in rego, f'{t[\"model\"]}: {field}={val} not found in rego'
          print(f'Predicate OK: {len(pred[\"targets\"])} target(s) consistent with rego')
          "

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-generate-policy-output
          path: |
            generated-policy.rego
            predicate.json

  test-ita-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Create policy with unique nonce
        id: create-policy
        run: |
          NONCE=$(python3 -c "import uuid; print(uuid.uuid4())")
          cp .github/workflows/test-actions/ita-roundtrip/minimal-policy.rego test-policy.rego
          echo "integritee_nonce := \"$NONCE\"" >> test-policy.rego
          echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"

      - name: Upload policy to ITA (create)
        id: create
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: test-policy.rego
          policy-name: ci-test-${{ github.run_id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Fetch created policy
        id: fetch-created
        uses: ./.github/actions/fetch-ita-policy
        with:
          policy-id: ${{ steps.create.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Assert created policy matches
        run: diff test-policy.rego "${{ steps.fetch-created.outputs.policy-file }}"

      - name: Update policy with new nonce
        run: |
          NEW_NONCE=$(python3 -c "import uuid; print(uuid.uuid4())")
          cp .github/workflows/test-actions/ita-roundtrip/minimal-policy.rego test-policy.rego
          echo "integritee_nonce := \"$NEW_NONCE\"" >> test-policy.rego

      - name: Upload policy to ITA (update)
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: test-policy.rego
          policy-id: ${{ steps.create.outputs.policy-id }}
          policy-name: ci-test-${{ github.run_id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Fetch updated policy
        id: fetch-updated
        uses: ./.github/actions/fetch-ita-policy
        with:
          policy-id: ${{ steps.create.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Assert updated policy matches
        run: diff test-policy.rego "${{ steps.fetch-updated.outputs.policy-file }}"

      - name: Delete test policy from ITA
        id: delete-first
        if: always()
        uses: ./.github/actions/delete-ita-policy
        with:
          policy-id: ${{ steps.create.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Delete again (idempotent, should report not found)
        id: delete-second
        if: always()
        uses: ./.github/actions/delete-ita-policy
        with:
          policy-id: ${{ steps.create.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Assert delete outputs
        if: always()
        run: |
          if [ "${{ steps.delete-first.outputs.existed }}" != "true" ]; then
            echo "ERROR: first delete should report existed=true"
            exit 1
          fi
          if [ "${{ steps.delete-second.outputs.existed }}" != "false" ]; then
            echo "ERROR: second delete should report existed=false"
            exit 1
          fi
          echo "DELETE verified: first=existed, second=not found (idempotent)"

  test-merge-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Merge with new and duplicate targets
        id: merge
        uses: ./.github/actions/merge-manifest
        with:
          base: .github/workflows/test-actions/merge-manifest/base-manifest.yaml
          new: .github/workflows/test-actions/merge-manifest/new-manifest.yaml

      - name: Assert counts
        run: |
          if [ "${{ steps.merge.outputs.added }}" != "1" ]; then
            echo "ERROR: expected added=1, got ${{ steps.merge.outputs.added }}"
            exit 1
          fi
          if [ "${{ steps.merge.outputs.skipped }}" != "1" ]; then
            echo "ERROR: expected skipped=1, got ${{ steps.merge.outputs.skipped }}"
            exit 1
          fi
          if [ "${{ steps.merge.outputs.total }}" != "2" ]; then
            echo "ERROR: expected total=2, got ${{ steps.merge.outputs.total }}"
            exit 1
          fi
          echo "Merge counts OK: added=1, skipped=1, total=2"

      - name: Assert merged manifest contains both models
        run: |
          python3 -c "
          import yaml
          doc = yaml.safe_load(open('${{ steps.merge.outputs.manifest-file }}'))
          models = [t['model'] for t in doc['targets']]
          assert 'existing-model' in models, 'missing existing-model'
          assert 'new-model' in models, 'missing new-model'
          assert len(models) == 2, f'expected 2 targets, got {len(models)}'
          print(f'Merged manifest OK: {models}')
          "

      - name: Merge again (all duplicates)
        id: merge-dedup
        uses: ./.github/actions/merge-manifest
        with:
          base: ${{ steps.merge.outputs.manifest-file }}
          new: .github/workflows/test-actions/merge-manifest/new-manifest.yaml

      - name: Assert no additions on re-merge
        run: |
          if [ "${{ steps.merge-dedup.outputs.added }}" != "0" ]; then
            echo "ERROR: expected added=0 on re-merge, got ${{ steps.merge-dedup.outputs.added }}"
            exit 1
          fi
          echo "Re-merge dedup OK: added=0, skipped=${{ steps.merge-dedup.outputs.skipped }}"

  test-derive-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: blobheart

      - name: Derive manifest (single ref)
        id: derive-single
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-refs: "89ec4181ececbddabc81deb82183b556b4d5ec04"
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Verify single-ref manifest
        run: |
          grep -v '  desc:' ${{ steps.derive-single.outputs.manifest-files }} > /tmp/actual-no-desc.yaml
          diff .github/workflows/test-actions/derive-manifest/expected-manifest.yaml /tmp/actual-no-desc.yaml

      - name: Derive manifest (multiple refs, same ref twice)
        id: derive-multi
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-refs: "89ec4181ececbddabc81deb82183b556b4d5ec04 89ec4181ececbddabc81deb82183b556b4d5ec04"
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Verify multi-ref produces two manifest files
        run: |
          FILE_COUNT=$(echo "${{ steps.derive-multi.outputs.manifest-files }}" | wc -w)
          if [ "$FILE_COUNT" -ne 2 ]; then
            echo "ERROR: expected 2 manifest files, got $FILE_COUNT"
            exit 1
          fi
          for f in ${{ steps.derive-multi.outputs.manifest-files }}; do
            grep -v '  desc:' "$f" > /tmp/actual-no-desc.yaml
            diff .github/workflows/test-actions/derive-manifest/expected-manifest.yaml /tmp/actual-no-desc.yaml
          done

      - name: Clone blobheart at pinned ref
        run: |
          git clone --depth 1 https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/cohere-ai/blobheart.git /tmp/blobheart
          cd /tmp/blobheart && git fetch --depth 1 origin 89ec4181ececbddabc81deb82183b556b4d5ec04 && git checkout FETCH_HEAD

      - name: Derive manifest (local dir)
        id: derive-local
        uses: ./.github/actions/derive-manifest
        with:
          blobheart-dir: /tmp/blobheart

      - name: Verify local-dir manifest (ignoring desc field which differs for local)
        run: |
          grep -v '  desc:' ${{ steps.derive-local.outputs.manifest-files }} > /tmp/actual-no-desc.yaml
          diff .github/workflows/test-actions/derive-manifest/expected-manifest.yaml /tmp/actual-no-desc.yaml
