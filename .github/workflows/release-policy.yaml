# Generates and validates the composite attestation policy, uploads it and its
# RIMs to ITA, and publishes signed release assets and provenance.
#
# generate: builds and validates policies. It authenticates to GCP/GHCR to
# measure images but does not upload to ITA or create a GitHub release.
# publish: only on push to main, gated by the `release` environment, with
# access to ITA. Each release gets its own RIM set and policy.
# cleanup: 5 min after publishing, once servers and clients have moved to
# the new release, deletes what the previous release used in ITA and this one
# does not.
# A manual dispatch runs generate only (a dry run); to publish, merge the
# change to main.
name: Release Policy

on:
  push:
    branches: [main]
    paths:
      - "attestation-policy/policy-manifest.yaml"
      - "attestation-policy/initdata/**"
      - ".github/actions/generate-policy/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (empty = next patch vX.Y.Z)"
        required: false
        type: string
      reason:
        description: "Reason for this release"
        required: false
        type: string

permissions:
  contents: read

# queue: max releases every pushed manifest in order. The default cancels a
# waiting release when another push queues, failing add-from-blobheart's
# wait-release for that commit. A run holds the group through cleanup, so at
# most two releases' sets are ever live.
concurrency:
  group: production-ita-policy-release
  cancel-in-progress: false
  queue: max

jobs:
  # Queued runs may start out of push order. A later push to main has its own
  # run, which releases everything this commit changed, so skip this one rather
  # than overwrite the newer release with older policy.
  freshness:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check for a release run of a newer commit
        id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=false
          for sha in $(gh run list -R "$GITHUB_REPOSITORY" --workflow release-policy.yaml \
              --event push --branch main --limit 20 --json headSha --jq '.[].headSha'); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$sha" --jq .status)
            [ "$status" = ahead ] && stale=true
          done
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
          [ "$stale" = false ] || echo "::notice::a newer commit has a release run; skipping $GITHUB_SHA"

  generate:
    needs: freshness
    # stale is empty off main, so generate still runs there as a dry run.
    if: needs.freshness.outputs.stale != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write   # GCP workload identity federation
    outputs:
      version: ${{ steps.version.outputs.version }}
      ita-policy-file: ${{ steps.generate.outputs.ita-policy-file }}
      ita-rim-dir: ${{ steps.generate.outputs.ita-rim-dir }}
      trustee-cpu-policy-file: ${{ steps.generate.outputs.trustee-cpu-policy-file }}
      trustee-gpu-policy-file: ${{ steps.generate.outputs.trustee-gpu-policy-file }}
    env:
      REASON: ${{ inputs.reason || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: >-
          python3 .github/workflows/release-policy/manage.py resolve-version
          --requested "$REQUESTED_VERSION"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mint CC reader app token (read-only)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.CC_POLICY_READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_READER_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines,blobheart

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------------------------------------------------
      # Initialize predicate with workflow-level context
      # ----------------------------------------------------------------
      - name: Initialize predicate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 .github/workflows/release-policy/manage.py init-predicate
          --version "$VERSION"
          --output predicate.json

      # ----------------------------------------------------------------
      # Generate policy (appends targets + cvm_measure_version to predicate)
      # ----------------------------------------------------------------
      - name: Generate policy
        id: generate
        uses: ./.github/actions/generate-policy
        with:
          manifest-file: attestation-policy/policy-manifest.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          output-artifacts-dir: artifacts
          policy-types: ita trustee
          predicate-file: predicate.json
          version: ${{ steps.version.outputs.version }}

      # ----------------------------------------------------------------
      # Validate manifest
      # ----------------------------------------------------------------
      - name: Validate policy manifest
        uses: ./.github/actions/validate-manifest
        with:
          manifest-file: attestation-policy/policy-manifest.yaml

      # ----------------------------------------------------------------
      # Hand off to publish, and leave the same files behind for inspection
      # ----------------------------------------------------------------
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: attestation-release-assets
          path: |
            ${{ steps.generate.outputs.ita-policy-file }}
            ${{ steps.generate.outputs.ita-rim-dir }}
            ${{ steps.generate.outputs.trustee-cpu-policy-file }}
            ${{ steps.generate.outputs.trustee-gpu-policy-file }}
            predicate.json

  publish:
    needs: [freshness, generate]
    # Only a push to main publishes; the release environment is limited to main.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.freshness.outputs.stale == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read       # the release itself is created with the App token below
      attestations: write
      id-token: write      # Sigstore
    env:
      REASON: ${{ inputs.reason || '' }}
    steps:
      # Pin to the commit generate ran against, so a push landing mid-run
      # cannot pair the downloaded policy with a different manifest.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      - name: Download generated policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: attestation-release-assets

      - name: Mint CC policy app token (integritee write)
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.CC_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: integritee
          permission-contents: write

      # ----------------------------------------------------------------
      # Upload the RIMs and a new policy to ITA, then read the policy back to
      # prove the stored policy is exactly what generate produced. Both uploads
      # converge on ITA's state, so a rerun reuses what a failed run left.
      # ----------------------------------------------------------------
      - name: Upload RIMs to ITA
        uses: ./.github/actions/upload-ita-rims
        with:
          rim-dir: ${{ needs.generate.outputs.ita-rim-dir }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ vars.ITA_API_URL }}

      - name: Upload policy to ITA
        id: ita-upload
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: ${{ needs.generate.outputs.ita-policy-file }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ vars.ITA_API_URL }}
          predicate-file: predicate.json

      - name: Fetch uploaded policy from ITA
        id: fetch
        uses: ./.github/actions/fetch-ita-policy
        with:
          policy-id: ${{ steps.ita-upload.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ vars.ITA_API_URL }}

      - name: Verify uploaded policy
        run: diff "${{ needs.generate.outputs.ita-policy-file }}" "${{ steps.fetch.outputs.policy-file }}"

      - name: Render RP policy
        id: rp
        uses: ./.github/actions/render-ita-rp-policy
        with:
          rim-dir: ${{ needs.generate.outputs.ita-rim-dir }}
          policy-id: ${{ steps.ita-upload.outputs.policy-id }}
          policy-hash: ${{ steps.ita-upload.outputs.policy-hash }}

      # ITA serves a new RIM or policy after up to ~13 s. Nothing attests
      # against either until the release names them, so one wait here covers
      # both uploads.
      - name: Wait for ITA to serve the uploads
        run: sleep 15

      # ----------------------------------------------------------------
      # Attest policies with Sigstore
      # ----------------------------------------------------------------
      # One bundle with several subjects, so a single Rekor entry covers every
      # released policy.
      - name: Attest policies with Sigstore
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: |
            ${{ needs.generate.outputs.ita-policy-file }}
            ${{ steps.rp.outputs.ita-rp-policy-file }}
            ${{ needs.generate.outputs.ita-rim-dir }}/*.json
            ${{ needs.generate.outputs.trustee-cpu-policy-file }}
            ${{ needs.generate.outputs.trustee-gpu-policy-file }}
          predicate-type: https://cohere.com/attestation-policy/v1
          predicate-path: predicate.json

      # ----------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------
      - name: Prepare release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          POLICY_ID: ${{ steps.ita-upload.outputs.policy-id }}
        run: >-
          python3 .github/workflows/release-policy/manage.py prepare-assets
          --policy "${{ needs.generate.outputs.ita-policy-file }}"
          "${{ steps.rp.outputs.ita-rp-policy-file }}"
          "${{ needs.generate.outputs.trustee-cpu-policy-file }}"
          "${{ needs.generate.outputs.trustee-gpu-policy-file }}"
          --rim-dir "${{ needs.generate.outputs.ita-rim-dir }}"
          --manifest attestation-policy/policy-manifest.yaml
          --predicate predicate.json
          --bundle "$BUNDLE_PATH"
          --output-dir release-assets
          --release-notes release-body.md
          --policy-id "$POLICY_ID"
          --reason "$REASON"

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.generate.outputs.version }}
        run: >-
          gh release create "$VERSION"
          --title "Attestation Policy $VERSION"
          --notes-file release-body.md
          --latest
          release-assets/*

  cleanup:
    needs: [generate, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests

      # Servers move to the new policy on their next passport refresh so wait
      # a few minutes to ensure they stopped using the old policy ID.
      - name: Wait for servers and clients to move to the release
        run: sleep 300

      - name: Find what the release superseded
        id: superseded
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.generate.outputs.version }}
        run: >-
          python3 .github/workflows/release-policy/manage.py superseded-ita
          --version "$VERSION"

      # The policy goes first, so no policy is left importing missing RIMs.
      - name: Delete superseded policy
        if: steps.superseded.outputs.policy-id != ''
        uses: ./.github/actions/delete-ita-policy
        with:
          policy-id: ${{ steps.superseded.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ vars.ITA_API_URL }}

      - name: Delete superseded RIMs
        uses: ./.github/actions/delete-ita-rims
        with:
          rim-names: ${{ steps.superseded.outputs.rim-names }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ vars.ITA_API_URL }}
