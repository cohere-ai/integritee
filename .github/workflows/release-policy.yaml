# Generates and validates the composite attestation policy, uploads it to ITA,
# and publishes signed release assets and provenance.
#
# The generate job always runs and mutates nothing, so it is safe to dispatch
# from any branch to preview a policy. Every run that targets main publishes;
# the `release` environment enforces that same restriction where it cannot be
# bypassed by editing this file on a branch.
name: Release Policy

on:
  push:
    branches: [main]
    paths:
      - "attestation-policy/policy-manifest.yaml"
      - "attestation-policy/initdata/**"
      - ".github/actions/generate-policy/generate_policy/policy-template.rego"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (empty = next v0.0.1aN)"
        required: false
        type: string
      reason:
        description: "Reason for this release"
        required: false
        type: string
      ita_slot:
        description: "ITA policy slot"
        required: false
        default: "slot-a"
        type: choice
        options:
          - auto
          - slot-a
          - slot-b
permissions:
  contents: read

concurrency:
  group: production-ita-policy-release
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write  # GCP workload identity federation
    env:
      ITA_SLOT: ${{ inputs.ita_slot || 'slot-a' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      policy_id: ${{ steps.slot.outputs.policy_id }}
      policy_slot: ${{ steps.slot.outputs.policy_slot }}
      policy_name: ${{ steps.slot.outputs.policy_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
        run: >-
          python3 .github/workflows/release-policy/manage.py resolve-version
          --requested "$REQUESTED_VERSION"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml requests

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines,blobheart

      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------------------------------------------------
      # Initialize predicate with workflow-level context
      # ----------------------------------------------------------------
      - name: Initialize predicate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 .github/workflows/release-policy/manage.py init-predicate
          --version "$VERSION"
          --output predicate.json

      # ----------------------------------------------------------------
      # Generate policy (appends targets + cvm_measure_version to predicate)
      # ----------------------------------------------------------------
      - name: Generate policy
        uses: ./.github/actions/generate-policy
        with:
          manifest-file: attestation-policy/policy-manifest.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          output-artifacts-dir: artifacts
          output-policy-file: attestation-policy.rego
          predicate-file: predicate.json

      # ----------------------------------------------------------------
      # Resolve the blue/green slot and confirm the manifest is paired with it.
      # Both run unconditionally so that a non-publishing run still catches an
      # initdata set whose POLICY_IDS does not match the slot being targeted.
      # ----------------------------------------------------------------
      - name: Select ITA slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          ITA_SLOT_OVERRIDE: ${{ env.ITA_SLOT }}
        run: >-
          python3 .github/workflows/release-policy/manage.py select-slot
          --override "$ITA_SLOT_OVERRIDE" >> "$GITHUB_OUTPUT"

      - name: Verify manifest targets use selected ITA slot
        uses: ./.github/actions/validate-manifest
        with:
          manifest-file: attestation-policy/policy-manifest.yaml
          policy-id: ${{ steps.slot.outputs.policy_id }}

      # ----------------------------------------------------------------
      # Hand off to publish, and leave the same files behind for inspection
      # ----------------------------------------------------------------
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: attestation-release-assets
          path: |
            attestation-policy.rego
            predicate.json

  publish:
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read  # the release itself is created with the App token below
      attestations: write
      id-token: write  # Sigstore
    env:
      REASON: ${{ inputs.reason || '' }}
    steps:
      # Pin to the commit generate ran against, so a push landing mid-run cannot
      # pair the downloaded policy with a different manifest and initdata set.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: ${{ github.sha }}

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # The upload-ita-policy and fetch-ita-policy actions invoke python3
      # directly and do not install their own dependencies.
      - name: Install Python dependencies
        run: pip install requests

      - name: Download generated policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: attestation-release-assets

      - name: Mint Integritee release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CC_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: integritee
          permission-contents: write

      # ----------------------------------------------------------------
      # Upload to ITA, then read it back to prove the stored policy is exactly
      # the artifact generate produced
      # ----------------------------------------------------------------
      - name: Upload policy to ITA
        id: upload
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: attestation-policy.rego
          policy-id: ${{ needs.generate.outputs.policy_id }}
          policy-name: ${{ needs.generate.outputs.policy_name }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}
          predicate-file: predicate.json

      - name: Fetch uploaded policy from ITA
        id: fetch
        uses: ./.github/actions/fetch-ita-policy
        with:
          policy-id: ${{ steps.upload.outputs.policy-id }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}

      - name: Verify uploaded policy
        run: diff attestation-policy.rego "${{ steps.fetch.outputs.policy-file }}"

      # ----------------------------------------------------------------
      # Attest policy with Sigstore
      # ----------------------------------------------------------------
      - name: Attest policy with Sigstore
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: attestation-policy.rego
          predicate-type: https://cohere.com/attestation-policy/v1
          predicate-path: predicate.json

      # ----------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------
      - name: Prepare release assets
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          POLICY_ID: ${{ needs.generate.outputs.policy_id }}
          POLICY_SLOT: ${{ needs.generate.outputs.policy_slot }}
        run: >-
          python3 .github/workflows/release-policy/manage.py prepare-assets
          --policy attestation-policy.rego
          --manifest attestation-policy/policy-manifest.yaml
          --predicate predicate.json
          --bundle "$BUNDLE_PATH"
          --output-dir release-assets
          --release-notes release-body.md
          --policy-id "$POLICY_ID"
          --policy-slot "$POLICY_SLOT"
          --reason "$REASON"

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          VERSION: ${{ needs.generate.outputs.version }}
        run: >-
          gh release create "$VERSION"
          --title "Attestation Policy $VERSION"
          --notes-file release-body.md
          release-assets/attestation-policy.rego
          release-assets/policy-manifest.yaml
          release-assets/policy-manifest-bundle.tar.gz
          release-assets/predicate.json
          release-assets/attestation-bundle.sigstore.json
