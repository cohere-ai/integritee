name: Release Policy

on:
  push:
    branches: [shariq/policy-automation]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.0.1)"
        required: true
        type: string
      reason:
        description: "Reason for this release"
        required: false
        type: string
      ita_slot:
        description: "ITA policy slot override (auto = blue/green rotation)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - slot-a
          - slot-b
      dry_run:
        description: "Skip ITA upload, Sigstore signing, and GitHub release creation"
        required: false
        default: true
        type: boolean

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
      VERSION: ${{ inputs.version || 'dev' }}
      ITA_SLOT: ${{ inputs.ita_slot || 'auto' }}
      REASON: ${{ inputs.reason || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: cohere-cc-baselines,blobheart

      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3  # v2.0.0

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------------------------------------------------
      # Initialize predicate with workflow-level context
      # ----------------------------------------------------------------
      - name: Fetch previous release log index
        id: chain
        run: |
          PREV_INDEX=0
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          if [[ -n "$LATEST" ]]; then
            echo "Previous release: $LATEST"
          fi
          echo "previous_log_index=$PREV_INDEX" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Initialize predicate
        run: |
          python3 -c "
          import json, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          with open('predicate.json', 'w') as f:
              json.dump({
                  'version': '${{ env.VERSION }}',
                  'manifest_commit': commit,
                  'previous_rekor_log_index': ${{ steps.chain.outputs.previous_log_index }},
              }, f, indent=2)
              f.write('\n')
          "

      # ----------------------------------------------------------------
      # Generate policy (appends targets + cvm_measure_version to predicate)
      # ----------------------------------------------------------------
      - name: Generate policy
        uses: ./.github/actions/generate-policy
        with:
          manifest-file: attestation-policy/policy-manifest.yaml
          github-token: ${{ steps.app-token.outputs.token }}
          output-artifacts-dir: artifacts
          output-policy-file: attestation-policy.rego
          predicate-file: predicate.json

      # ----------------------------------------------------------------
      # Upload to ITA (blue/green slot selection)
      # ----------------------------------------------------------------
      - name: Select ITA slot
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          ITA_SLOT_OVERRIDE: ${{ env.ITA_SLOT }}
        run: python3 .github/workflows/release-policy/select-ita-slot.py >> "$GITHUB_OUTPUT"

      - name: Upload policy to ITA
        if: ${{ env.DRY_RUN == 'false' }}
        uses: ./.github/actions/upload-ita-policy
        with:
          policy-file: attestation-policy.rego
          policy-id: ${{ steps.slot.outputs.policy_id }}
          policy-name: ${{ steps.slot.outputs.policy_name }}
          ita-api-key: ${{ secrets.ITA_ADMIN_API_KEY }}
          ita-api-url: ${{ secrets.ITA_API_URL }}
          predicate-file: predicate.json

      # ----------------------------------------------------------------
      # Attest policy with Sigstore
      # ----------------------------------------------------------------
      - name: Attest policy with Sigstore
        if: ${{ env.DRY_RUN == 'false' }}
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: attestation-policy.rego
          predicate-type: https://cohere.com/attestation-policy/v1
          predicate-path: predicate.json

      # ----------------------------------------------------------------
      # Upload workflow artifacts (always, for inspection)
      # ----------------------------------------------------------------
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: attestation-release-assets
          path: |
            attestation-policy.rego
            predicate.json

      # ----------------------------------------------------------------
      # Create GitHub Release
      # ----------------------------------------------------------------
      - name: Prepare release assets
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          mkdir -p release-assets
          cp attestation-policy.rego release-assets/attestation-policy.rego
          cp predicate.json release-assets/predicate.json
          cp "${{ steps.attest.outputs.bundle-path }}" release-assets/attestation-bundle.sigstore.json

          RELEASE_BODY=""

          if [[ -n "${{ env.REASON }}" ]]; then
            RELEASE_BODY+="**Reason:** ${{ env.REASON }}\n\n"
          fi

          RELEASE_BODY+="**ITA Policy ID:** \`${{ steps.slot.outputs.policy_id }}\`\n"
          RELEASE_BODY+="**ITA Policy Slot:** \`${{ steps.slot.outputs.policy_slot }}\`\n"

          echo -e "$RELEASE_BODY" > release-body.md

      - name: Create release
        if: ${{ env.DRY_RUN == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VERSION }}" \
            --title "Attestation Policy ${{ env.VERSION }}" \
            --notes-file release-body.md \
            release-assets/*
