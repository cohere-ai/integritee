name: "Demo: Blobheart Release Flow"

on:
  push:
    branches: [shariq/policy-automation]
  workflow_dispatch:
    inputs:
      blobheart_refs:
        description: "Space-separated blobheart commit SHAs"
        required: false
        type: string

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      BLOBHEART_REFS: ${{ inputs.blobheart_refs || '47ded742780246155c119caa1b3f90fd8b598c58' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.CC_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CC_POLICY_APP_PRIVATE_KEY }}
          owner: cohere-ai
          repositories: blobheart

      - name: Trigger add-from-blobheart (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=blobheart-deploy \
            -f 'client_payload[blobheart_refs]=${{ env.BLOBHEART_REFS }}' \
            -f 'client_payload[dry_run]=true'

      - name: Verify against policy (with retry)
        uses: ./.github/actions/verify-against-policy
        with:
          blobheart-refs: ${{ env.BLOBHEART_REFS }}
          blobheart-token: ${{ steps.app-token.outputs.token }}
          policy-manifest: attestation-policy/policy-manifest.yaml
          retries: "2"
          retry-delay: "5"
