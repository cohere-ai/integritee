# Always-on lint/test gate for main. Path-filtered action suites stay in test-actions.yaml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -e "./clients/python[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            .github/actions \
            .github/workflows \
            clients/python \
            tests

      - name: Test
        # Suites that currently match the repo layout. Expand as scaffold tests catch up.
        run: |
          pytest \
            tests/test_policy_actions.py \
            tests/test_tng_client.py \
            tests/test_versioned_baselines.py \
            -v --tb=short
