name: "Upload ITA Policy"
description: "Create or update an Intel Trust Authority attestation policy, reusing an existing policy with the same name and content"

inputs:
  policy-file:
    description: "Path to the .rego policy file"
    required: true
  policy-id:
    description: "ID of an existing policy to overwrite"
    required: false
  policy-name:
    description: "Name for the policy (default: integritee-<SHA-256 prefix of the content>)"
    required: false
  ita-api-key:
    description: "ITA admin API key"
    required: true
  ita-api-url:
    description: "ITA API base URL"
    required: false
    default: "https://api.trustauthority.intel.com"
  predicate-file:
    description: "Path to predicate JSON file; read and updated in place with policy_id (optional)"
    required: false

outputs:
  policy-id:
    description: "ID of the created/updated policy"
    value: ${{ steps.upload.outputs.policy-id }}
  policy-hash:
    description: "ITA's policy_hash for the policy's content"
    value: ${{ steps.upload.outputs.policy-hash }}

runs:
  using: "composite"
  steps:
    - name: Upload policy to ITA
      id: upload
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy-file }}
        POLICY_ID: ${{ inputs.policy-id }}
        POLICY_NAME: ${{ inputs.policy-name }}
        ITA_API_KEY: ${{ inputs.ita-api-key }}
        ITA_API_URL: ${{ inputs.ita-api-url }}
        PREDICATE_FILE: ${{ inputs.predicate-file }}
      run: python3 "${{ github.action_path }}/upload.py" >> "$GITHUB_OUTPUT"
