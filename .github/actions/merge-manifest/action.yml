name: "Merge Manifest"
description: "Merge new policy manifests into a base manifest with content-addressed deduplication"

inputs:
  base:
    description: "Path to the base manifest file"
    required: true
  new:
    description: "Whitespace-separated (spaces or newlines) paths to new manifest file(s)"
    required: true

outputs:
  manifest-file:
    description: "Path to the merged manifest"
    value: ${{ steps.merge.outputs.manifest-file }}
  added:
    description: "Number of new targets added"
    value: ${{ steps.merge.outputs.added }}
  skipped:
    description: "Number of duplicate targets skipped"
    value: ${{ steps.merge.outputs.skipped }}
  total:
    description: "Total targets in the output manifest"
    value: ${{ steps.merge.outputs.total }}
  added-models:
    description: "Comma-separated model names for newly added targets"
    value: ${{ steps.merge.outputs.added-models }}

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: pip install 'pyyaml>=6,<7' 'jsonschema>=4,<5' >/dev/null 2>&1

    - name: Merge manifests
      id: merge
      shell: bash
      env:
        BASE_MANIFEST: ${{ inputs.base }}
        NEW_MANIFESTS: ${{ inputs.new }}
      run: |
        # Split on any whitespace, including newlines from a `new: |` block.
        # Plain `read -a` stops at the first newline and drops later
        # manifests; `-d ''` reads to EOF (and returns 1 there, hence `|| true`).
        read -r -d '' -a NEW_FILES <<< "$NEW_MANIFESTS" || true
        if [[ ${#NEW_FILES[@]} -eq 0 ]]; then
          echo "ERROR: no new manifests provided" >&2
          exit 1
        fi
        python3 "${{ github.action_path }}/merge-manifest.py" \
          --base "$BASE_MANIFEST" \
          --new "${NEW_FILES[@]}" \
          --output "$RUNNER_TEMP/merged-policy-manifest.yaml" \
          >> "$GITHUB_OUTPUT"
