name: "Derive Manifest"
description: "Derive policy manifests from one or more blobheart refs with fully resolved targets"

inputs:
  blobheart-refs:
    description: "Space-separated blobheart commit SHAs to derive manifests from"
    required: true
  github-token:
    description: "GitHub token with read access to blobheart"
    required: true

outputs:
  manifest-files:
    description: "Space-separated paths to the derived policy-manifest YAML files"
    value: ${{ steps.derive.outputs.manifest-files }}

runs:
  using: "composite"
  steps:
    - name: Install Python dependencies
      shell: bash
      run: pip install pyyaml >/dev/null 2>&1

    - name: Derive manifests from blobheart refs
      id: derive
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        MANIFEST_FILES=""
        for REF in ${{ inputs.blobheart-refs }}; do
          echo "========================================"
          echo "Deriving manifest from blobheart ref: $REF"
          echo "========================================"

          MANIFEST_FILE="${RUNNER_TEMP}/derived-manifest-${REF}.yaml"
          python3 "${{ github.action_path }}/derive.py" \
            --blobheart-ref "$REF" \
            --output "$MANIFEST_FILE"

          MANIFEST_FILES="$MANIFEST_FILES $MANIFEST_FILE"
        done
        echo "manifest-files=${MANIFEST_FILES# }" >> "$GITHUB_OUTPUT"
