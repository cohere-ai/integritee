name: "Generate Policy"
description: "Generate an ITA attestation policy from a policy manifest"

inputs:
  manifest-file:
    description: "Path to a policy-manifest.yaml file"
    required: true
  github-token:
    description: "GitHub token with read access to cohere-cc-baselines and GHCR"
    required: true
  output-artifacts-dir:
    description: "Path to write intermediate artifacts (baselines, firmware, UKI, per-target measurements)"
    required: true
  output-policy-file:
    description: "Path to write the generated .rego policy file"
    required: true
  predicate-file:
    description: "Path to predicate JSON file; read and updated in place with target data (optional)"
    required: false

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    GH_TOKEN: ${{ inputs.github-token }}
    BASELINES_REPO: "cohere-ai/cohere-cc-baselines"
    PODVM_IMAGE: "ghcr.io/cohere-ai/cloud-api-adaptor/podvm"
    INPUT_MANIFEST_FILE: ${{ inputs.manifest-file }}
    INPUT_OUTPUT_ARTIFACTS_DIR: ${{ inputs.output-artifacts-dir }}
    INPUT_OUTPUT_POLICY_FILE: ${{ inputs.output-policy-file }}
    INPUT_PREDICATE_FILE: ${{ inputs.predicate-file }}
