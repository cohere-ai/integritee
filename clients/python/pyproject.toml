[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-integrity-client"
version = "0.1.0"
description = "Client library for Cohere's model integrity ledger"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["model_integrity"]
